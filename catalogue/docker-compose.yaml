service:
  catalogue:
    build:
       dockerfile: catalogue.Dockerfile
    image: joindevops.catalogue:1.0.0
    Container_name: catalogue
    depends_on:
    - mongodb
  user:
    build:
      dockerfile: user.Dockerfile
    image: joindevops/user:1.0.0
    container_name: user
    depends_on:
    - radis  
  frontend:  
    build:
      dockerfile: frontend.Dockerfile
    image: joindevops/frontend:1.0.0
    container_name: frontend
    depends_on:   
    - catalogue
    - user
  mongodb:
    build:
      dockerfile: mongodb.Dockerfile
    image: joindevops/mongodb:1.0.0
    container_name: mongodb 
  radis:
    image: radis:7.0
    container_name: radis  
networks:
  default:
    driver: bridge
    name: roboshop
    external: false    